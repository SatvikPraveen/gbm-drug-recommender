[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbm-drug-recommender"
version = "3.0.0"
description = "Reproducible analysis of GDSC drug-response data for glioblastoma: structure-based potency prediction, similarity, and combination hypotheses."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Satvik Praveen", email = "satvikpraveen707@gmail.com" }]
keywords = ["glioblastoma", "GDSC", "cheminformatics", "drug-response", "graph-neural-networks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "joblib>=1.3",
    "rdkit>=2024.3",
    "pubchempy>=1.0.4",
    "networkx>=3.1",
    "torch>=2.4",
    "torch-geometric>=2.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "umap-learn>=0.5.6",
    "tqdm>=4.65",
    "requests>=2.31",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35"]
notebook = ["jupyter>=1.0", "ipykernel>=6.23", "ipywidgets>=8.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/SatvikPraveen/gbm-drug-recommender"
Issues = "https://github.com/SatvikPraveen/gbm-drug-recommender/issues"

[tool.setuptools.packages.find]
include = ["gbm_drug*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks", ".venv", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # function calls in argument defaults (used for config-driven defaults)
    "B905",  # zip without strict= (py310 compat)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # scripts put the project root on sys.path before importing gbm_drug

[tool.ruff.lint.isort]
known-first-party = ["gbm_drug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that train models or take more than a few seconds",
    "network: tests that require internet access",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch",
    "ignore::FutureWarning:torch",
]

[tool.coverage.run]
source = ["gbm_drug"]
omit = ["gbm_drug/utils/visualization.py"]
