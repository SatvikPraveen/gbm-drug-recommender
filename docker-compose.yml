services:
  # Full pipeline (CPU). Mount data/ and results/ so outputs land in the checkout.
  pipeline:
    build: .
    image: gbm-drug-recommender:latest
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    command: python main.py --device cpu

  # Fast smoke run (no GNN, 1 CV repeat).
  quick:
    build: .
    image: gbm-drug-recommender:latest
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    command: python main.py --quick --device cpu
    profiles: [quick]

  # GNN only: grouped + scaffold CV against the baseline, then a final model.
  gnn:
    build: .
    image: gbm-drug-recommender:latest
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    command: python train_gnn.py --device cpu
    profiles: [gnn]

  # Streamlit dashboard over results/ at http://localhost:8501
  dashboard:
    build: .
    image: gbm-drug-recommender:latest
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    profiles: [dashboard]

  # Unit tests.
  test:
    build: .
    image: gbm-drug-recommender:latest
    command: python -m pytest -q
    profiles: [test]
